spring:
  datasource:
    url: ${DATABASE_URL}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

app:
  email:
    from: ${MAIL_FROM}
  frontend:
    url: ${FRONTEND_URL}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}